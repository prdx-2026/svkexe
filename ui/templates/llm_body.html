{{define "llm_body"}}
<section class="panel" style="flex-direction:row; align-items:center; gap:20px; flex-wrap:wrap; padding:20px 22px;">
    <div style="flex:1 1 280px; display:flex; flex-direction:column; gap:4px;">
        <h3>{{t "llm.default"}}</h3>
        <p class="panel-sub">{{t "llm.default_sub"}}</p>
    </div>
    {{if .Models}}
    <form style="flex:1 1 280px; max-width:420px;"
          hx-post="/dashboard/keys/default" hx-trigger="change" hx-target="#llm-body" hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful){svkToast(I18N.defaultToast)}">
        <select class="input" name="model" aria-label="{{t "llm.default_label"}}" style="height:40px; font-size:13.5px;">
            <option value="" {{if .Auto}}selected{{end}}>{{t "llm.auto"}}</option>
            {{range .Models}}<option value="{{.ID}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>{{end}}
        </select>
    </form>
    {{else}}
    <p class="panel-note" style="flex:1 1 280px; max-width:420px;">{{t "llm.none"}}</p>
    {{end}}
</section>

<section class="list" id="key-table-body">
    {{template "key_list" .Keys}}
</section>
{{end}}
